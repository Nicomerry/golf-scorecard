  <!-- TOP HEADER -->

  <!-- FIXED BOTTOM NAVIGATION -->
  <nav class="bottom-nav" aria-label="Navigazione principale">
    <button type="button" class="nav-btn active" data-tab="campo">
      <span class="nav-ico">🏌️</span>

    </button>
    <button type="button" class="nav-btn" data-tab="scorecard">

    </button>

      <span>Campi</span>
    </button>
    <button type="button" class="nav-btn" data-tab="storico">
      <span class="nav-ico">🏆</span>
      <span>Storico</span>
    </button>
  </nav>

  <!-- MODAL & TOAST ROOTS -->
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      'use strict';

      // =====================================================================
      // 1. PWA ICONE PNG & WEB APP MANIFEST SILENZIOSO (ZERO BLOB SW / ZERO UI)
      // =====================================================================
      function initSilentPWA() {
        try {
          function drawGolfIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            if (!ctx) return '';

            const r = Math.round(size * 0.22);
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(size - r, 0);
            ctx.quadraticCurveTo(size, 0, size, r);
            ctx.lineTo(size, size - r);
            ctx.quadraticCurveTo(size, size, size - r, size);
            ctx.lineTo(r, size);
            ctx.quadraticCurveTo(0, size, 0, size - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();

            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#1B4332');
            grad.addColorStop(1, '#2D6A4F');
            ctx.fillStyle = grad;
            ctx.fill();

            // Green ellipse
            ctx.fillStyle = '#52B788';
            ctx.beginPath();
            ctx.ellipse(size * 0.5, size * 0.76, size * 0.34, size * 0.11, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cup hole
            ctx.fillStyle = '#081C15';
            ctx.beginPath();
            ctx.ellipse(size * 0.45, size * 0.76, size * 0.045, size * 0.022, 0, 0, Math.PI * 2);
            ctx.fill();

            // Flagpole
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = Math.max(2, size * 0.032);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(size * 0.45, size * 0.75);
            ctx.lineTo(size * 0.45, size * 0.23);
            ctx.stroke();

            // Gold/Red flag
            ctx.fillStyle = '#E63946';
            ctx.beginPath();
            ctx.moveTo(size * 0.465, size * 0.24);
            ctx.lineTo(size * 0.76, size * 0.34);
            ctx.lineTo(size * 0.465, size * 0.45);
            ctx.closePath();
            ctx.fill();

            // Golf ball
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(size * 0.65, size * 0.68, size * 0.065, 0, Math.PI * 2);
            ctx.fill();

            return canvas.toDataURL('image/png');
          }

          const icon192 = drawGolfIcon(192);
          const icon512 = drawGolfIcon(512);

          if (icon192) {
            const appleLink = document.getElementById('appleTouchIconLink');
            const favLink = document.getElementById('faviconLink');
            if (appleLink) appleLink.href = icon192;
            if (favLink) favLink.href = icon192;
          }

          const manifestObj = {
            name: 'Golf Scorecard Pro',
            short_name: 'Golf Score',
            description: 'Scorecard Golf 18 Buche e Statistiche',
            start_url: './',
            display: 'standalone',
            orientation: 'portrait',
            theme_color: '#1B4332',
            background_color: '#F1F8F5',
            icons: [
              { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
              { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
            ]
          };

          const manifestLink = document.getElementById('pwaManifestLink');
          if (manifestLink && icon192 && icon512) {
            manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
          }
        } catch (err) {
          // Ignora silenziosamente su ambienti senza Canvas
        }
      }

      // =====================================================================
      // 2. STORAGE SICURO & DATI PREDEFINITI
      // =====================================================================
      const STORAGE_KEY = 'golf_scorecard_pro_v4';

      function storageRead(key) {
        try {
          return window.localStorage ? window.localStorage.getItem(key) : null;
        } catch (e) {
          return null;
        }
      }

      function storageWrite(key, value) {
        try {
          if (window.localStorage) {
            window.localStorage.setItem(key, value);
          }
        } catch (e) {
          // Fallback in memoria se localStorage non disponibile
        }
      }

      const DEFAULT_COURSES = [
        {
          id: 'course_milano_72',
          name: 'Golf Club Milano — Par 72',
          pars: [4, 4, 3, 5, 4, 4, 3, 4, 5, 4, 4, 3, 5, 4, 4, 3, 4, 5],
          si:   [7, 13, 17, 3, 1, 11, 15, 9, 5, 8, 14, 18, 4, 2, 12, 16, 10, 6]
        },
        {
          id: 'course_villadeste_69',
          name: "Circolo Golf Villa d'Este — Par 69",
          pars: [4, 4, 3, 4, 4, 4, 3, 5, 4, 4, 3, 4, 4, 3, 4, 4, 3, 5],
          si:   [5, 11, 15, 1, 9, 7, 17, 3, 13, 6, 16, 2, 10, 18, 8, 12, 14, 4]
        },
        {
          id: 'course_standard_72',
          name: 'Percorso Standard — Par 72',
          pars: [4, 4, 3, 5, 4, 4, 3, 4, 5, 4, 4, 3, 5, 4, 4, 3, 4, 5],
          si:   [1, 3, 5, 7, 9, 11, 13, 15, 17, 2, 4, 6, 8, 10, 12, 14, 16, 18]
        }
      ];

      function makeId(prefix) {
        return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
      }

      function getTodayISO() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // =====================================================================
      // 3. STATO DELL'APPLICAZIONE
      // =====================================================================
      const state = {
        activeTab: 'campo',
        currentHole: 0, // 0..17
        historyFilterCourse: 'ALL',
        courses: [],
        rounds: []
      };

      function loadState() {
        const raw = storageRead(STORAGE_KEY);
        if (raw) {
          try {
            const data = JSON.parse(raw);
            state.courses = Array.isArray(data.courses) && data.courses.length
              ? data.courses
              : JSON.parse(JSON.stringify(DEFAULT_COURSES));
            state.rounds = Array.isArray(data.rounds) ? data.rounds : [];
            state.currentHole = typeof data.currentHole === 'number'
              ? Math.max(0, Math.min(17, data.currentHole))
              : 0;
            return;
          } catch (e) {
            // Ripristino sicuro
          }
        }

        state.courses = JSON.parse(JSON.stringify(DEFAULT_COURSES));
        const c0 = state.courses[0];
        state.rounds = [
          {
            id: makeId('round'),
            status: 'active',
            courseId: c0.id,
            clubName: c0.name,
            date: getTodayISO(),
            formula: 'Stableford Individuale',
            tee: 'Gialli',
            marker: '',
            pars: c0.pars.slice(),
            si: c0.si.slice(),
            players: [
              {
                id: makeId('pl'),
                name: 'Giocatore 1',
                hcp: 16,
                scores: [4, 5, 3, 6, 5, 4, 4, 5, 5, null, null, null, null, null, null, null, null, null]
              }
            ]
          }
        ];
        state.currentHole = 9;
        saveState();
      }

      function saveState() {
        storageWrite(STORAGE_KEY, JSON.stringify({
          courses: state.courses,
          rounds: state.rounds,
          currentHole: state.currentHole
        }));
      }

      function getActiveRound() {
        return state.rounds.find(function (r) { return r.status === 'active'; }) || null;
      }

      // =====================================================================
      // 4. TOAST E MODALI INTERNI (ZERO WINDOW.ALERT / WINDOW.CONFIRM)
      // =====================================================================
      let toastTimeout = null;
      function showToast(text) {
        const root = document.getElementById('toastRoot');
        if (!root) return;
        root.innerHTML = `<div class="toast-msg">${escapeHTML(text)}</div>`;
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function () {
          if (root) root.innerHTML = '';
        }, 2500);
      }

      function closeModal() {
        const root = document.getElementById('modalRoot');
        if (root) root.innerHTML = '';
      }

      function openConfirmModal(options) {
        const title = options.title || 'Conferma';
        const message = options.message || '';

        const isDanger = Boolean(options.danger);

        const root = document.getElementById('modalRoot');
        root.innerHTML = `

              </div>

              <div class="grid-2">
                <button type="button" class="btn btn-secondary" id="confirmCancelBtn">Annulla</button>
                <button type="button" class="btn ${isDanger ? 'btn-danger' : 'btn-primary'}" id="confirmOkBtn">${escapeHTML(confirmLabel)}</button>
              </div>
            </div>
          </div>
        `;

        document.getElementById('confirmBackdrop').addEventListener('click', function (e) {
          if (e.target === this) closeModal();
        });
        document.getElementById('confirmCloseX').addEventListener('click', closeModal);
        document.getElementById('confirmCancelBtn').addEventListener('click', closeModal);
        document.getElementById('confirmOkBtn').addEventListener('click', function () {

        });
      }

      // =====================================================================
      // 5. MOTORE DI CALCOLO GOLF (EXTRA STROKES, NETTO, STABLEFORD, VS PAR)
      // =====================================================================
      function calcExtraStrokes(hcp, holeSi) {
        const h = Number(hcp) || 0;
        const si = Number(holeSi) || 18;
        if (h >= 0) {
          const base = Math.floor(h / 18);
          const rem = h % 18;
          return base + (si <= rem ? 1 : 0);
        } else {
          const absH = Math.abs(h);
          const base = Math.floor(absH / 18);
          const rem = absH % 18;
          return -(base + ((19 - si) <= rem ? 1 : 0));
        }
      }

      function getHoleBadge(strokes, par) {
        if (!strokes || strokes <= 0) {
          return { label: 'Da giocare', cls: 'res-none' };
        }
        const diff = strokes - par;
        if (diff <= -3) return { label: 'Albatross', cls: 'res-eagle' };
        if (diff === -2) return { label: 'Eagle', cls: 'res-eagle' };
        if (diff === -1) return { label: 'Birdie', cls: 'res-birdie' };
        if (diff === 0)  return { label: 'Par', cls: 'res-par' };
        if (diff === 1)  return { label: 'Bogey', cls: 'res-bogey' };
        return { label: diff === 2 ? 'Doppio Bogey' : '+' + diff, cls: 'res-double' };
      }

      function computePlayerStats(player, pars, si) {
        const hcp = Number(player.hcp) || 0;
        let outGross = 0;
        let inGross = 0;
        let outStb = 0;
        let inStb = 0;
        let holesPlayed = 0;
        let playedParSum = 0;
        let playedExtraSum = 0;

        const counts = { eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0 };
        const holeStb = new Array(18).fill(null);
        const holeExtra = new Array(18).fill(0);
        const parGroups = {
          3: { sum: 0, count: 0 },
          4: { sum: 0, count: 0 },
          5: { sum: 0, count: 0 }
        };

        for (let i = 0; i < 18; i++) {
          const extra = calcExtraStrokes(hcp, si[i]);
          holeExtra[i] = extra;
          const sc = player.scores[i];
          const par = Number(pars[i]) || 4;

          if (sc && sc > 0) {
            holesPlayed++;
            playedParSum += par;
            playedExtraSum += extra;

            if (i < 9) outGross += sc;
            else inGross += sc;

            const netHole = sc - extra;
            const stb = Math.max(0, 2 + (par - netHole));
            holeStb[i] = stb;
            if (i < 9) outStb += stb;
            else inStb += stb;

            const diff = sc - par;
            if (diff <= -2) counts.eagle++;
            else if (diff === -1) counts.birdie++;
            else if (diff === 0) counts.par++;
            else if (diff === 1) counts.bogey++;
            else counts.double++;

            if (parGroups[par]) {
              parGroups[par].sum += sc;
              parGroups[par].count++;
            }
          }
        }

        const totGross = outGross + inGross;
        const totStb = outStb + inStb;
        const netPlayed = holesPlayed > 0 ? (totGross - playedExtraSum) : 0;
        const grossVsPar = holesPlayed > 0 ? (totGross - playedParSum) : 0;
        const netVsPar = holesPlayed > 0 ? (netPlayed - playedParSum) : 0;

        return {
          outGross: outGross,
          inGross: inGross,
          totGross: totGross,
          outStb: outStb,
          inStb: inStb,
          totStb: totStb,
          netPlayed: netPlayed,
          grossVsPar: grossVsPar,
          netVsPar: netVsPar,
          holesPlayed: holesPlayed,
          playedParSum: playedParSum,
          counts: counts,
          parGroups: parGroups,
          holeStb: holeStb,
          holeExtra: holeExtra
        };
      }

      function formatVsPar(diff, holesPlayed) {
        if (!holesPlayed) return '—';
        if (diff === 0) return 'E';
        return diff > 0 ? ('+' + diff) : String(diff);
      }

      function getVsParClass(diff, holesPlayed) {
        if (!holesPlayed) return '';
        if (diff < 0) return 'vspar-under';
        if (diff === 0) return 'vspar-even';
        return 'vspar-over';
      }

      // =====================================================================
      // 6. NAVIGAZIONE & RENDER PRINCIPALE
      // =====================================================================
      function switchTab(tab) {
        state.activeTab = tab;
        document.querySelectorAll('.nav-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
        });
        renderApp();
      }

      function updateHeader() {
        const sub = document.getElementById('headerSub');
        const active = getActiveRound();
        if (!sub) return;
        if (active) {
          sub.textContent = `${active.clubName} • ${active.date}`;
        } else {
          sub.textContent = 'Nessuna partita in corso';
        }
      }

      function renderApp() {
        updateHeader();
        const root = document.getElementById('appRoot');
        if (!root) return;

        if (state.activeTab === 'campo') {
          root.innerHTML = buildCampoHTML();
          bindCampoEvents();
        } else if (state.activeTab === 'scorecard') {
          root.innerHTML = buildScorecardHTML();
          bindScorecardEvents();
        } else if (state.activeTab === 'campi') {
          root.innerHTML = buildCampiHTML();
          bindCampiEvents();
        } else if (state.activeTab === 'storico') {
          root.innerHTML = buildStoricoHTML();
          bindStoricoEvents();
        }
      }

      // =====================================================================
      // 7. SCHEDA "CAMPO" (INSERIMENTO BUCA PER BUCA)
      // =====================================================================
      function buildCampoHTML() {
        const round = getActiveRound();
        if (!round) {
          return `
            <div class="card" style="text-align:center; padding:30px 16px; margin-top:10px;">
              <div style="font-size:44px; margin-bottom:8px;">⛳</div>
              <h2 style="margin:0 0 6px 0; font-size:18px; color:var(--forest);">Nessuna partita attiva</h2>
              <p style="margin:0 0 18px 0; font-size:13px; color:var(--muted); line-height:1.45;">
                Avvia una nuova partita scegliendo uno dei campi salvati oppure riapri un giro dallo storico.
              </p>
              <div style="display:flex; flex-direction:column; gap:8px; max-width:280px; margin:0 auto;">
                <button type="button" class="btn btn-primary btn-full" id="emptyStartNewBtn">+ Nuova Partita</button>
                <button type="button" class="btn btn-secondary btn-full" id="emptyGoHistoryBtn">Vai allo Storico</button>
              </div>
            </div>
          `;
        }

        const h = state.currentHole;
        const holeNum = h + 1;
        const par = round.pars[h];
        const si = round.si[h];
        const totPar = round.pars.reduce(function (a, b) { return a + b; }, 0);

        const holeStripHTML = round.pars.map(function (p, idx) {
          const played = round.players.some(function (pl) { return pl.scores[idx] && pl.scores[idx] > 0; });
          const cls = idx === h ? 'hole-chip active' : (played ? 'hole-chip played' : 'hole-chip');
          return `
            <button type="button" class="${cls}" data-hole-idx="${idx}">
              <span class="hole-chip-num">${idx + 1}</span>
              <span class="hole-chip-par">P${p}</span>
            </button>
          `;
        }).join('');

        const playersHTML = round.players.map(function (pl, pIdx) {
          const strokes = pl.scores[h];
          const st = computePlayerStats(pl, round.pars, round.si);
          const extra = st.holeExtra[h];
          const stbHole = st.holeStb[h];
          const badge = getHoleBadge(strokes, par);

          const quickButtons = [2, 3, 4, 5, 6, 7, 8].map(function (val) {
            return `<button type="button" class="quick-key ${strokes === val ? 'selected' : ''}" data-pidx="${pIdx}" data-val="${val}">${val}</button>`;
          }).join('');

          return `
            <div class="card">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
                <div>
                  <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <strong style="font-size:15px;">${escapeHTML(pl.name)}</strong>
                    <span class="pill pill-forest">HCP ${pl.hcp}</span>
                    <span class="pill pill-gold">Extra: ${extra >= 0 ? '+' + extra : extra}</span>
                  </div>
                  <div style="font-size:12px; color:var(--muted); margin-top:5px;">
                    Lordo: <strong style="color:var(--ink);">${st.totGross || '—'}</strong> (${formatVsPar(st.grossVsPar, st.holesPlayed)})
                    • Netto: <strong style="color:var(--ink);">${st.holesPlayed ? st.netPlayed : '—'}</strong>
                    • Netto vs Par: <span class="${getVsParClass(st.netVsPar, st.holesPlayed)}">${formatVsPar(st.netVsPar, st.holesPlayed)}</span>
                  </div>
                </div>
                <div style="text-align:right; flex-shrink:0;">
                  <span class="pill ${badge.cls}">${badge.label}</span>
                  <div style="font-size:12px; font-weight:800; color:var(--forest); margin-top:4px;">
                    ${stbHole !== null ? stbHole + ' pt' : '— pt'} <span style="color:var(--muted); font-weight:600;">(Tot ${st.totStb})</span>
                  </div>
                </div>
              </div>

              <div class="stepper-row">
                <button type="button" class="step-btn" data-step-pidx="${pIdx}" data-delta="-1" aria-label="Diminuisci colpi">−</button>
                <div class="stroke-box">
                  <div class="stroke-num">${strokes || '—'}</div>
                  <div class="stroke-caption">Colpi Buca ${holeNum}</div>
                </div>
                <button type="button" class="step-btn plus" data-step-pidx="${pIdx}" data-delta="1" aria-label="Aumenta colpi">+</button>
              </div>

              <div class="quick-row">${quickButtons}</div>
            </div>
          `;
        }).join('');

        return `
          <div class="hole-strip" id="holeStrip">${holeStripHTML}</div>

          <div class="hero-card">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <div>
                <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:#FDE68A; font-weight:800;">
                  Buca ${holeNum} di 18 • Par Campo ${totPar}
                </div>
                <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
                  <button type="button" id="quickEditHoleBtn" class="btn-ghost-light" style="font-weight:900;">
                    PAR ${par} • S.I. ${si} ✎
                  </button>
                </div>
              </div>
              <div style="display:flex; gap:6px;">
                <button type="button" class="btn-ghost-light" id="prevHoleBtn" ${h === 0 ? 'disabled style="opacity:0.4;"' : ''}>◀ Prec</button>
                <button type="button" class="btn-header-new" id="nextHoleBtn" ${h === 17 ? 'disabled style="opacity:0.4;"' : ''}>Succ ▶</button>
              </div>
            </div>
          </div>

          ${playersHTML}

          <div class="card" style="background:var(--sage-bg); border-color:var(--sage-light);">
            <button type="button" class="btn btn-primary btn-full" id="archiveActiveCampoBtn">
              ✓ Termina e Archivia Partita
            </button>
          </div>
        `;
      }

      function bindCampoEvents() {
        const emptyNew = document.getElementById('emptyStartNewBtn');
        if (emptyNew) emptyNew.addEventListener('click', function () { openNewRoundModal(null); });

        const emptyHist = document.getElementById('emptyGoHistoryBtn');
        if (emptyHist) emptyHist.addEventListener('click', function () { switchTab('storico'); });

        const round = getActiveRound();
        if (!round) return;

        document.querySelectorAll('[data-hole-idx]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const idx = Number(this.getAttribute('data-hole-idx'));
            selectHole(idx);
          });
        });

        const prevBtn = document.getElementById('prevHoleBtn');
        if (prevBtn) prevBtn.addEventListener('click', function () { selectHole(Math.max(0, state.currentHole - 1)); });

        const nextBtn = document.getElementById('nextHoleBtn');
        if (nextBtn) nextBtn.addEventListener('click', function () { selectHole(Math.min(17, state.currentHole + 1)); });

        const quickEditBtn = document.getElementById('quickEditHoleBtn');
        if (quickEditBtn) quickEditBtn.addEventListener('click', openQuickHoleEditModal);

        document.querySelectorAll('[data-step-pidx]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const pIdx = Number(this.getAttribute('data-step-pidx'));
            const delta = Number(this.getAttribute('data-delta'));
            const par = round.pars[state.currentHole] || 4;
            const cur = round.players[pIdx].scores[state.currentHole];
            if (!cur) {
              round.players[pIdx].scores[state.currentHole] = Math.max(1, par + (delta > 0 ? 0 : -1));
            } else {
              round.players[pIdx].scores[state.currentHole] = Math.max(1, Math.min(15, cur + delta));
            }
            saveState();
            renderApp();
          });
        });

        document.querySelectorAll('[data-val]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const pIdx = Number(this.getAttribute('data-pidx'));
            const val = Number(this.getAttribute('data-val'));
            const cur = round.players[pIdx].scores[state.currentHole];
            round.players[pIdx].scores[state.currentHole] = (cur === val) ? null : val;
            saveState();
            renderApp();
          });
        });

        const archBtn = document.getElementById('archiveActiveCampoBtn');
        if (archBtn) archBtn.addEventListener('click', confirmArchiveActiveRound);
      }

      function selectHole(idx) {
        state.currentHole = Math.max(0, Math.min(17, idx));
        saveState();
        renderApp();
        const strip = document.getElementById('holeStrip');
        if (strip && strip.children[state.currentHole]) {
          strip.children[state.currentHole].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }

      function confirmArchiveActiveRound() {
        const round = getActiveRound();
        if (!round) return;
        openConfirmModal({
          title: 'Termina e Archivia Partita',
          message: `Vuoi chiudere la partita al "${round.clubName}" e archiviarla nello storico come completata?`,
          confirmLabel: 'Chiudi e Archivia',
          onConfirm: function () {
            round.status = 'completed';
            round.completedAt = new Date().toISOString();
            saveState();
            showToast('Partita salvata nello Storico!');
            switchTab('storico');
          }
        });
      }

      function openQuickHoleEditModal() {
        const round = getActiveRound();
        if (!round) return;
        const h = state.currentHole;
        let draftPar = round.pars[h];
        let draftSi = round.si[h];

        function renderQuickModal() {
          document.getElementById('modalRoot').innerHTML = `
            <div class="modal-overlay" id="qhBackdrop">
              <div class="modal-box" style="max-width:420px;">
                <div class="modal-head">
                  <h3 class="modal-title">Modifica Buca ${h + 1}</h3>
                  <button type="button" class="modal-close" id="qhCloseBtn">✕</button>
                </div>
                <div class="form-group">
                  <label class="form-label">Par Buca ${h + 1}</label>
                  <div class="par-toggle">
                    <button type="button" class="${draftPar === 3 ? 'active' : ''}" data-qpar="3">Par 3</button>
                    <button type="button" class="${draftPar === 4 ? 'active' : ''}" data-qpar="4">Par 4</button>
                    <button type="button" class="${draftPar === 5 ? 'active' : ''}" data-qpar="5">Par 5</button>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Stroke Index / Handicap Buca (1–18)</label>
                  <input type="number" id="qhSiInput" class="form-input" min="1" max="18" value="${draftSi}" />
                </div>
                <div class="form-group" style="display:flex; align-items:center; gap:8px;">
                  <input type="checkbox" id="qhSyncCourse" checked style="width:18px; height:18px; accent-color:var(--forest);" />
                  <label for="qhSyncCourse" style="font-size:12px; font-weight:700;">Aggiorna anche il campo in libreria</label>
                </div>
                <div class="grid-2" style="margin-top:14px;">
                  <button type="button" class="btn btn-secondary" id="qhCancelBtn">Annulla</button>
                  <button type="button" class="btn btn-primary" id="qhSaveBtn">Salva Buca</button>
                </div>
              </div>
            </div>
          `;

          document.getElementById('qhBackdrop').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
          document.getElementById('qhCloseBtn').addEventListener('click', closeModal);
          document.getElementById('qhCancelBtn').addEventListener('click', closeModal);

          document.querySelectorAll('[data-qpar]').forEach(function (b) {
            b.addEventListener('click', function () {
              draftPar = Number(this.getAttribute('data-qpar'));
              draftSi = Math.max(1, Math.min(18, parseInt(document.getElementById('qhSiInput').value, 10) || draftSi));
              renderQuickModal();
            });
          });

          document.getElementById('qhSaveBtn').addEventListener('click', function () {
            const finalSi = Math.max(1, Math.min(18, parseInt(document.getElementById('qhSiInput').value, 10) || 1));
            const sync = document.getElementById('qhSyncCourse').checked;
            round.pars[h] = draftPar;
            round.si[h] = finalSi;
            if (sync && round.courseId) {
              const c = state.courses.find(function (x) { return x.id === round.courseId; });
              if (c) {
                c.pars[h] = draftPar;
                c.si[h] = finalSi;
              }
            }
            saveState();
            closeModal();
            showToast(`Buca ${h + 1}: Par ${draftPar}, S.I. ${finalSi}`);
            renderApp();
          });
        }

        renderQuickModal();
      }

      // =====================================================================
      // 8. SCHEDA "SCORECARD" (TABELLA 18 BUCHE + CSV EXCEL)
      // =====================================================================
      function buildScorecardTablesHTML(round, interactive) {
        const outPar = round.pars.slice(0, 9).reduce(function (a, b) { return a + b; }, 0);
        const inPar = round.pars.slice(9, 18).reduce(function (a, b) { return a + b; }, 0);
        const totPar = outPar + inPar;

        function buildHalfTable(startIdx, endIdx, subLabel, subPar) {
          const isBack = startIdx === 9;
          let headCols = '';
          let siCols = '';
          let parCols = '';

          for (let i = startIdx; i < endIdx; i++) {
            headCols += `<th>${i + 1}</th>`;
            siCols += `<td style="color:var(--muted); font-size:10px;">${round.si[i]}</td>`;
            parCols += `<td style="font-weight:800; background:#F3F8F5;">${round.pars[i]}</td>`;
          }

          let playersRows = '';
          round.players.forEach(function (pl) {
            const st = computePlayerStats(pl, round.pars, round.si);
            let scoreCols = '';
            let stbCols = '';

            for (let i = startIdx; i < endIdx; i++) {
              const sc = pl.scores[i];
              const stb = st.holeStb[i];
              const badge = getHoleBadge(sc, round.pars[i]);
              const jumpAttr = interactive ? `data-jump-hole="${i}" style="cursor:pointer;"` : '';
              scoreCols += `<td ${jumpAttr}>${sc ? `<span class="score-dot ${badge.cls}">${sc}</span>` : '—'}</td>`;
              stbCols += `<td style="color:var(--muted); font-size:10px;">${stb !== null ? stb : '—'}</td>`;
            }

            const subGross = isBack ? st.inGross : st.outGross;
            const subStb = isBack ? st.inStb : st.outStb;

            playersRows += `
              <tr>
                <td class="sticky-col">
                  <div style="font-weight:800;">${escapeHTML(pl.name)}</div>
                  <div style="font-size:10px; color:var(--muted);">HCP ${pl.hcp}</div>
                </td>
                ${scoreCols}
                <td class="sc-sub">${subGross || '—'}</td>
                ${isBack ? `
                  <td class="sc-tot">${st.totGross || '—'}</td>
                  <td class="sc-net">${st.holesPlayed ? st.netPlayed : '—'}</td>
                  <td class="sc-sub ${getVsParClass(st.netVsPar, st.holesPlayed)}">${formatVsPar(st.netVsPar, st.holesPlayed)}</td>
                ` : ''}
              </tr>
              <tr>
                <td class="sticky-col" style="background:var(--bg); color:var(--sage); font-size:10px; font-weight:700;">Stableford</td>
                ${stbCols}
                <td class="sc-sub">${subStb}</td>
                ${isBack ? `
                  <td class="sc-tot" style="color:#FDE68A !important;">${st.totStb} pt</td>
                  <td class="sc-sub" style="font-size:10px;">L: ${formatVsPar(st.grossVsPar, st.holesPlayed)}</td>
                  <td class="sc-sub" style="font-size:10px;">${st.holesPlayed}/18</td>
                ` : ''}
              </tr>
            `;
          });

          return `
            <div class="table-scroll">
              <table class="sc-table">
                <thead>
                  <tr>
                    <th class="sticky-col">Buca</th>
                    ${headCols}
                    <th>${subLabel}</th>
                    ${isBack ? `
                      <th>LORDO</th>
                      <th style="background:var(--gold); color:#13261C;">NETTO</th>
                      <th style="background:var(--forest-light);">Net vs Par</th>
                    ` : ''}
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td class="sticky-col" style="color:var(--muted); font-weight:700;">S.I.</td>
                    ${siCols}
                    <td class="sc-sub">—</td>
                    ${isBack ? `<td colspan="3" class="sc-sub">Par Campo: ${totPar}</td>` : ''}
                  </tr>
                  <tr>
                    <td class="sticky-col" style="font-weight:800; color:var(--forest);">PAR</td>
                    ${parCols}
                    <td class="sc-sub">${subPar}</td>
                    ${isBack ? `
                      <td class="sc-tot">${totPar}</td>
                      <td class="sc-net">—</td>
                      <td class="sc-sub">E</td>
                    ` : ''}
                  </tr>
                  ${playersRows}
                </tbody>
              </table>
            </div>
          `;
        }

        return buildHalfTable(0, 9, 'OUT', outPar) + buildHalfTable(9, 18, 'IN', inPar);
      }

      function exportRoundCSV(roundId) {
        const round = state.rounds.find(function (r) { return r.id === roundId; });
        if (!round) return;

        const outPar = round.pars.slice(0, 9).reduce(function (a, b) { return a + b; }, 0);
        const inPar = round.pars.slice(9, 18).reduce(function (a, b) { return a + b; }, 0);
        const totPar = outPar + inPar;

        const lines = [];
        lines.push(`SCORECARD GOLF 18 BUCHE;${round.clubName}`);
        lines.push(`Data;${round.date};Formula;${round.formula};Tee;${round.tee};Marcatore;${round.marker || ''}`);
        lines.push('');

        const header = [
          'Buca / Giocatore',
          '1','2','3','4','5','6','7','8','9','OUT',
          '10','11','12','13','14','15','16','17','18','IN',
          'TOT Lordo','Netto','Lordo vs Par','Netto vs Par','Stableford TOT'
        ];
        lines.push(header.join(';'));
        lines.push(['S.I.'].concat(round.si.slice(0, 9), [''], round.si.slice(9, 18), ['', '', '', '', '', '']).join(';'));
        lines.push(['PAR'].concat(round.pars.slice(0, 9), [outPar], round.pars.slice(9, 18), [inPar, totPar, '', '', '', '']).join(';'));

        round.players.forEach(function (pl) {
          const st = computePlayerStats(pl, round.pars, round.si);
          const sOut = pl.scores.slice(0, 9).map(function (v) { return v || ''; });
          const sIn = pl.scores.slice(9, 18).map(function (v) { return v || ''; });
          lines.push([`${pl.name} (HCP ${pl.hcp}) - Colpi`].concat(
            sOut, [st.outGross || ''],
            sIn, [st.inGross || ''],
            [
              st.totGross || '',
              st.holesPlayed ? st.netPlayed : '',
              formatVsPar(st.grossVsPar, st.holesPlayed),
              formatVsPar(st.netVsPar, st.holesPlayed),
              st.totStb
            ]
          ).join(';'));

          const stbOut = st.holeStb.slice(0, 9).map(function (v) { return v !== null ? v : ''; });
          const stbIn = st.holeStb.slice(9, 18).map(function (v) { return v !== null ? v : ''; });
          lines.push([`${pl.name} - Stableford`].concat(
            stbOut, [st.outStb],
            stbIn, [st.inStb],
            ['', '', '', '', st.totStb]
          ).join(';'));
        });

        try {
          const csvContent = '\uFEFF' + lines.join('\r\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Scorecard_${round.clubName.replace(/[^a-zA-Z0-9]/g, '_')}_${round.date}.csv`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('File CSV per Excel scaricato!');
        } catch (e) {
          showToast('Download CSV non disponibile su questo dispositivo.');
        }
      }

      function openCourseEditorModal(courseId) {
        let draft;
        if (courseId) {
          const orig = state.courses.find(function (c) { return c.id === courseId; });
          draft = {
            id: orig.id,
            name: orig.name,
            pars: orig.pars.slice(),
            si: orig.si.slice()
          };
        } else {
          draft = {
            id: null,
            name: '',
            pars: [4, 4, 3, 5, 4, 4, 3, 4, 5, 4, 4, 3, 5, 4, 4, 3, 4, 5],
            si:   [1, 3, 5, 7, 9, 11, 13, 15, 17, 2, 4, 6, 8, 10, 12, 14, 16, 18]
          };
        }

        function renderEditor() {
          const totPar = draft.pars.reduce(function (a, b) { return a + b; }, 0);
          const siFreq = {};
          draft.si.forEach(function (v) { siFreq[v] = (siFreq[v] || 0) + 1; });
          const dups = Object.keys(siFreq).filter(function (k) { return siFreq[k] > 1; });

          const rows = draft.pars.map(function (p, idx) {
            const isDup = siFreq[draft.si[idx]] > 1;
            return `
              <div class="course-hole-row">
                <strong style="font-size:13px; color:var(--forest);">Buca ${idx + 1}</strong>
                <div class="par-toggle">
                  <button type="button" class="${p === 3 ? 'active' : ''}" data-ce-h="${idx}" data-ce-p="3">Par 3</button>
                  <button type="button" class="${p === 4 ? 'active' : ''}" data-ce-h="${idx}" data-ce-p="4">Par 4</button>
                  <button type="button" class="${p === 5 ? 'active' : ''}" data-ce-h="${idx}" data-ce-p="5">Par 5</button>
                </div>
                <input type="number" min="1" max="18" value="${draft.si[idx]}" data-ce-si="${idx}"
                  style="width:100%; padding:6px 6px; border-radius:8px; border:1.5px solid ${isDup ? 'var(--danger)' : 'var(--border)'}; text-align:center; font-weight:800; font-size:13px;" />
              </div>
            `;
          }).join('');

          document.getElementById('modalRoot').innerHTML = `
            <div class="modal-overlay" id="ceBackdrop">
              <div class="modal-box">

                  <h3 class="modal-title">${draft.id ? 'Modifica Campo' : 'Nuovo Campo'}</h3>
                  <button type="button" class="modal-close" id="ceCloseBtn">✕</button>
                </div>

                <div class="form-group">
                  <label class="form-label">Nome Circolo / Percorso</label>
                  <input type="text" id="ceNameInput" class="form-input" placeholder="Es. Golf Club Brianza" value="${escapeHTML(draft.name)}" />
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
                  <span class="pill pill-gold">Totale Par: ${totPar}</span>
                  <button type="button" class="btn btn-secondary" style="padding:6px 10px; font-size:12px;" id="ceAutoSiBtn">
                    Auto-assegna S.I. 1–18
                  </button>
                </div>

                ${dups.length ? `
                  <div style="background:var(--danger-bg); color:var(--danger); padding:8px 10px; border-radius:10px; font-size:12px; font-weight:700; margin-bottom:10px;">
                    S.I. duplicati (${dups.join(', ')}): ogni buca da 1 a 18 deve avere un indice univoco.
                  </div>
                ` : ''}

                <div style="display:grid; grid-template-columns:54px 1fr 74px; font-size:10px; font-weight:800; color:var(--muted); padding-bottom:4px; border-bottom:1px solid var(--border);">
                  <span>BUCA</span>
                  <span>PAR</span>
                  <span style="text-align:center;">S.I. 1-18</span>
                </div>

                <div style="max-height:42dvh; overflow-y:auto; margin-bottom:14px;">
                  ${rows}
                </div>

                <div class="grid-2">
                  <button type="button" class="btn btn-secondary" id="ceCancelBtn">Annulla</button>
                  <button type="button" class="btn btn-primary" id="ceSaveBtn">Salva Campo</button>
                </div>
              </div>
            </div>
          `;

          document.getElementById('ceBackdrop').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
          document.getElementById('ceCloseBtn').addEventListener('click', closeModal);
          document.getElementById('ceCancelBtn').addEventListener('click', closeModal);

          document.getElementById('ceNameInput').addEventListener('input', function () {
            draft.name = this.value;
          });

          document.getElementById('ceAutoSiBtn').addEventListener('click', function () {
            draft.si = [1, 3, 5, 7, 9, 11, 13, 15, 17, 2, 4, 6, 8, 10, 12, 14, 16, 18];
            renderEditor();
            showToast('Indici S.I. standard 1-18 assegnati');
          });

          document.querySelectorAll('[data-ce-h]').forEach(function (b) {
            b.addEventListener('click', function () {
              const hIdx = Number(this.getAttribute('data-ce-h'));
              const pVal = Number(this.getAttribute('data-ce-p'));
              draft.pars[hIdx] = pVal;
              renderEditor();
            });
          });

          document.querySelectorAll('[data-ce-si]').forEach(function (inp) {
            inp.addEventListener('change', function () {
              const hIdx = Number(this.getAttribute('data-ce-si'));
              const val = Math.max(1, Math.min(18, parseInt(this.value, 10) || 1));
              draft.si[hIdx] = val;
              renderEditor();
            });
          });

          document.getElementById('ceSaveBtn').addEventListener('click', function () {
            const cleanName = (draft.name || '').trim();
            if (!cleanName) {
              showToast('Inserisci il nome del campo');
              return;
            }
            const uniqueSet = new Set(draft.si);
            if (uniqueSet.size !== 18) {
              showToast('Gli S.I. devono essere tutti diversi da 1 a 18');
              return;
            }

            if (draft.id) {
              const idx = state.courses.findIndex(function (c) { return c.id === draft.id; });
              if (idx >= 0) {
                state.courses[idx] = { id: draft.id, name: cleanName, pars: draft.pars.slice(), si: draft.si.slice() };
              }
            } else {
              state.courses.unshift({ id: makeId('course'), name: cleanName, pars: draft.pars.slice(), si: draft.si.slice() });
            }
            saveState();
            closeModal();
            showToast('Campo salvato!');
            renderApp();
          });
        }

        renderEditor();
      }

      function buildStoricoHTML() {
        const filterId = state.historyFilterCourse;
        const filtered = state.rounds.filter(function (r) {
          return filterId === 'ALL' || r.courseId === filterId;
        });

        const gross18 = [];
        const stb18 = [];
        let bestNetVsPar = null;

        filtered.forEach(function (r) {
          const p1 = r.players[0];
          if (p1) {
            const st = computePlayerStats(p1, r.pars, r.si);
            if (st.holesPlayed === 18) {
              gross18.push(st.totGross);
              stb18.push(st.totStb);
              if (bestNetVsPar === null || st.netVsPar < bestNetVsPar) {
                bestNetVsPar = st.netVsPar;
              }
            }
          }
        });

        const avgGross = gross18.length ? (gross18.reduce(function (a, b) { return a + b; }, 0) / gross18.length).toFixed(1) : '—';
        const avgStb = stb18.length ? (stb18.reduce(function (a, b) { return a + b; }, 0) / stb18.length).toFixed(1) : '—';
        const bestNetLabel = bestNetVsPar !== null ? formatVsPar(bestNetVsPar, 18) : '—';

        const filterOptions = [`<option value="ALL" ${filterId === 'ALL' ? 'selected' : ''}>Tutti i campi (${state.rounds.length})</option>`]
          .concat(state.courses.map(function (c) {
            return `<option value="${c.id}" ${filterId === c.id ? 'selected' : ''}>${escapeHTML(c.name)}</option>`;
          })).join('');

        const listHTML = filtered.length === 0 ? `
          <div class="card" style="text-align:center; padding:26px 16px;">
            <p style="margin:0 0 12px 0; color:var(--muted); font-size:13px;">Nessuna partita registrata per questo filtro.</p>
            <button type="button" class="btn btn-primary" id="histEmptyNewBtn">+ Nuova Partita</button>
          </div>
        ` : filtered.map(function (r) {
          const isActive = r.status === 'active';
          const playersLines = r.players.map(function (pl) {
            const st = computePlayerStats(pl, r.pars, r.si);
            return `
              <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:4px 0; border-top:1px dashed #E5ECE8;">
                <span><strong>${escapeHTML(pl.name)}</strong> <span style="color:var(--muted);">(HCP ${pl.hcp})</span></span>
                <span>
                  Lordo <strong>${st.totGross || '—'}</strong> •
                  Netto <strong>${st.holesPlayed ? st.netPlayed : '—'}</strong>
                  (<span class="${getVsParClass(st.netVsPar, st.holesPlayed)}">${formatVsPar(st.netVsPar, st.holesPlayed)}</span>) •
                  <strong style="color:var(--forest);">${st.totStb} pt</strong>
                </span>
              </div>
            `;
          }).join('');

          return `
            <div class="round-card" data-open-round="${r.id}">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px;">
                <div>
                  <div style="font-size:14px; font-weight:900; color:var(--forest);">${escapeHTML(r.clubName)}</div>
                  <div style="font-size:11px; color:var(--muted); margin-top:2px;">
                    ${r.date} • ${escapeHTML(r.formula)} • Tee ${escapeHTML(r.tee)}
                  </div>
                </div>
                <span class="pill ${isActive ? 'pill-active' : 'pill-done'}">
                  ${isActive ? '● IN CORSO' : '✓ COMPLETATA'}
                </span>
              </div>

              ${playersLines}

              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:6px; border-top:1px solid #EEF3F0; font-size:11px; font-weight:800; color:var(--forest);">
                <span>Tocca per dettagli e statistiche →</span>
                ${isActive ? `<button type="button" class="btn btn-secondary" style="padding:4px 9px; font-size:11px;" data-quick-close="${r.id}">Chiudi giro</button>` : ''}
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="card">
            <div class="form-group" style="margin-bottom:10px;">
              <label class="form-label">Filtra per Campo</label>
              <select class="form-select" id="histFilterSelect">${filterOptions}</select>
            </div>
            <div class="grid-4">
              <div class="stat-box">
                <div class="stat-val">${filtered.length}</div>
                <div class="stat-lbl">Partite</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">${avgGross}</div>
                <div class="stat-lbl">Media Colpi</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">${bestNetLabel}</div>
                <div class="stat-lbl">Miglior Net/Par</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">${avgStb}</div>
                <div class="stat-lbl">Media Stb</div>
              </div>
            </div>
          </div>

          <div class="section-head">
            <h2 class="section-title">Partite Salvate (${filtered.length})</h2>
          </div>

          ${listHTML}
        `;
      }

      function bindStoricoEvents() {
        const filterSel = document.getElementById('histFilterSelect');
        if (filterSel) {
          filterSel.addEventListener('change', function () {
            state.historyFilterCourse = this.value;
            renderApp();
          });
        }

        const emptyBtn = document.getElementById('histEmptyNewBtn');
        if (emptyBtn) emptyBtn.addEventListener('click', function () { openNewRoundModal(null); });

        document.querySelectorAll('[data-open-round]').forEach(function (card) {
          card.addEventListener('click', function () {
            openRoundDetailModal(this.getAttribute('data-open-round'));
          });
        });

        document.querySelectorAll('[data-quick-close]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            const rId = this.getAttribute('data-quick-close');
            const r = state.rounds.find(function (x) { return x.id === rId; });
            if (!r) return;
            openConfirmModal({
              title: 'Chiudi Partita',
              message: `Vuoi segnare la partita al "${r.clubName}" come COMPLETATA?`,
              confirmLabel: 'Chiudi Giro',
              onConfirm: function () {
                r.status = 'completed';
                r.completedAt = new Date().toISOString();
                saveState();
                showToast('Partita chiusa e archiviata');
                renderApp();
              }
            });
          });
        });
      }

      function openRoundDetailModal(roundId) {
        const r = state.rounds.find(function (x) { return x.id === roundId; });
        if (!r) return;

        const totPar = r.pars.reduce(function (a, b) { return a + b; }, 0);
        const ranked = r.players.map(function (pl) {
          return { player: pl, stats: computePlayerStats(pl, r.pars, r.si) };
        }).sort(function (a, b) {
          return b.stats.totStb - a.stats.totStb;
        });

        const rankingHTML = ranked.map(function (item, idx) {
          const pl = item.player;
          const st = item.stats;
          const avg3 = st.parGroups[3].count ? (st.parGroups[3].sum / st.parGroups[3].count).toFixed(2) : '—';
          const avg4 = st.parGroups[4].count ? (st.parGroups[4].sum / st.parGroups[4].count).toFixed(2) : '—';
          const avg5 = st.parGroups[5].count ? (st.parGroups[5].sum / st.parGroups[5].count).toFixed(2) : '—';

          return `
            <div class="card" style="background:var(--bg); margin-bottom:10px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <div>
                  <strong style="font-size:14px; color:var(--forest);">#${idx + 1} ${escapeHTML(pl.name)}</strong>
                  <span class="pill pill-forest" style="margin-left:4px;">HCP ${pl.hcp}</span>
                </div>
                <span class="pill pill-gold">${st.totStb} pt Stb</span>
              </div>

              <div class="grid-4" style="margin-bottom:8px;">
                <div class="stat-box" style="background:var(--white);">
                  <div class="stat-val">${st.totGross || '—'}</div>
                  <div class="stat-lbl">Lordo (${formatVsPar(st.grossVsPar, st.holesPlayed)})</div>
                </div>
                <div class="stat-box" style="background:var(--white);">
                  <div class="stat-val">${st.holesPlayed ? st.netPlayed : '—'}</div>
                  <div class="stat-lbl">Netto</div>
                </div>
                <div class="stat-box" style="background:var(--white);">
                  <div class="stat-val ${getVsParClass(st.netVsPar, st.holesPlayed)}">${formatVsPar(st.netVsPar, st.holesPlayed)}</div>
                  <div class="stat-lbl">Netto vs Par</div>
                </div>
                <div class="stat-box" style="background:var(--white);">
                  <div class="stat-val">${st.holesPlayed}/18</div>
                  <div class="stat-lbl">Buche</div>
                </div>
              </div>

              <div style="display:flex; gap:5px; flex-wrap:wrap; margin-bottom:6px; font-size:11px;">
                <span class="pill res-eagle">Eagle+: ${st.counts.eagle}</span>
                <span class="pill res-birdie">Birdie: ${st.counts.birdie}</span>
                <span class="pill res-par">Par: ${st.counts.par}</span>
                <span class="pill res-bogey">Bogey: ${st.counts.bogey}</span>
                <span class="pill res-double">Doppio+: ${st.counts.double}</span>
              </div>

              <div style="font-size:11px; color:var(--muted);">
                Medie colpi: <strong>Par 3:</strong> ${avg3} • <strong>Par 4:</strong> ${avg4} • <strong>Par 5:</strong> ${avg5}
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('modalRoot').innerHTML = `
          <div class="modal-overlay" id="rdBackdrop">
            <div class="modal-box">
              <div class="modal-head">
                <div>
                  <h3 class="modal-title">${escapeHTML(r.clubName)}</h3>
                  <div style="font-size:11px; color:var(--muted); margin-top:2px;">
                    ${r.date} • ${escapeHTML(r.formula)} • Tee ${escapeHTML(r.tee)} • Par ${totPar}
                  </div>
                </div>
                <button type="button" class="modal-close" id="rdCloseBtn">✕</button>
              </div>

              ${rankingHTML}

              <div class="section-head" style="margin-top:10px;">
                <h4 class="section-title" style="font-size:14px;">Scorecard 18 Buche</h4>
                <button type="button" class="btn btn-secondary" style="padding:5px 10px; font-size:11px;" id="rdCsvBtn">📥 Esporta CSV</button>
              </div>

              ${buildScorecardTablesHTML(r, false)}

              <div class="grid-2" style="margin-top:10px;">
                <button type="button" class="btn btn-secondary" id="rdReopenBtn">🏌️ Riapri / Modifica</button>
                <button type="button" class="btn btn-primary" id="rdReplayBtn">🔄 Rigioca questo campo</button>
              </div>
              <button type="button" class="btn btn-danger btn-full" style="margin-top:8px;" id="rdDeleteBtn">🗑 Elimina partita</button>
            </div>
          </div>
        `;

        document.getElementById('rdBackdrop').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
        document.getElementById('rdCloseBtn').addEventListener('click', closeModal);
        document.getElementById('rdCsvBtn').addEventListener('click', function () { exportRoundCSV(r.id); });

        document.getElementById('rdReopenBtn').addEventListener('click', function () {
          state.rounds.forEach(function (item) {
            if (item.id === r.id) item.status = 'active';
            else if (item.status === 'active') item.status = 'completed';
          });
          saveState();
          closeModal();
          showToast('Partita riaperta nella scheda Campo');
          switchTab('campo');
        });

        document.getElementById('rdReplayBtn').addEventListener('click', function () {
          state.rounds.forEach(function (item) {
            if (item.status === 'active') item.status = 'completed';
          });
          const cloneRound = {
            id: makeId('round'),
            status: 'active',
            courseId: r.courseId,
            clubName: r.clubName,
            date: getTodayISO(),
            formula: r.formula,
            tee: r.tee,
            marker: r.marker || '',
            pars: r.pars.slice(),
            si: r.si.slice(),
            players: r.players.map(function (pl) {
              return {
                id: makeId('pl'),
                name: pl.name,
                hcp: pl.hcp,
                scores: new Array(18).fill(null)
              };
            })
          };
          state.rounds.unshift(cloneRound);
          state.currentHole = 0;
          saveState();
          closeModal();
          showToast('Nuovo giro avviato sullo stesso campo!');
          switchTab('campo');
        });

        document.getElementById('rdDeleteBtn').addEventListener('click', function () {
          openConfirmModal({
            title: 'Elimina Partita',
            message: `Vuoi eliminare definitivamente la partita al "${r.clubName}" del ${r.date}?`,
            confirmLabel: 'Elimina',
            danger: true,
            onConfirm: function () {
              state.rounds = state.rounds.filter(function (x) { return x.id !== r.id; });
              saveState();
              showToast('Partita eliminata');
              renderApp();
            }
          });
        });
      }

      // =====================================================================
      // 11. MODALE "NUOVA PARTITA"
      // =====================================================================
      function openNewRoundModal(preselectedCourseId) {
        let selectedCourseId = preselectedCourseId || (state.courses[0] ? state.courses[0].id : '');
        let roundDate = getTodayISO();
        let formula = 'Stableford Individuale';
        let tee = 'Gialli';
        let marker = '';
        let draftPlayers = [{ name: 'Giocatore 1', hcp: 16 }];

        function renderNewRound() {
          const courseOpts = state.courses.map(function (c) {
            const totPar = c.pars.reduce(function (a, b) { return a + b; }, 0);
            return `<option value="${c.id}" ${c.id === selectedCourseId ? 'selected' : ''}>${escapeHTML(c.name)} (Par ${totPar})</option>`;
          }).join('');

          const playersHTML = draftPlayers.map(function (pl, idx) {
            return `
              <div style="display:grid; grid-template-columns:1fr 78px 36px; gap:6px; align-items:center; margin-bottom:6px;">
                <input type="text" class="form-input" placeholder="Nome giocatore ${idx + 1}" value="${escapeHTML(pl.name)}" data-nr-pname="${idx}" />
                <input type="number" class="form-input" min="-10" max="54" placeholder="HCP" value="${pl.hcp}" data-nr-phcp="${idx}" />
                ${draftPlayers.length > 1
                  ? `<button type="button" class="btn btn-danger" style="padding:9px 0;" data-nr-pdel="${idx}">✕</button>`
                  : `<span></span>`
                }
              </div>
            `;
          }).join('');

          document.getElementById('modalRoot').innerHTML = `
            <div class="modal-overlay" id="nrBackdrop">
              <div class="modal-box">
                <div class="modal-head">
                  <h3 class="modal-title">Nuova Partita 18 Buche</h3>
                  <button type="button" class="modal-close" id="nrCloseBtn">✕</button>
                </div>

                <div class="form-group">
                  <label class="form-label">Campo da Golf</label>
                  <select id="nrCourseSel" class="form-select">${courseOpts}</select>
                </div>

                <div class="grid-2">
                  <div class="form-group">
                    <label class="form-label">Data</label>
                    <input type="date" id="nrDateInp" class="form-input" value="${roundDate}" />
                  </div>
                  <div class="form-group">
                    <label class="form-label">Tee di Partenza</label>
                    <select id="nrTeeSel" class="form-select">
                      <option value="Bianchi" ${tee === 'Bianchi' ? 'selected' : ''}>Bianchi</option>
                      <option value="Gialli" ${tee === 'Gialli' ? 'selected' : ''}>Gialli</option>
                      <option value="Blu" ${tee === 'Blu' ? 'selected' : ''}>Blu</option>
                      <option value="Rossi" ${tee === 'Rossi' ? 'selected' : ''}>Rossi</option>
                    </select>
                  </div>
                </div>

                <div class="grid-2">
                  <div class="form-group">
                    <label class="form-label">Formula</label>
                    <select id="nrFormulaSel" class="form-select">
                      <option value="Stableford Individuale" ${formula === 'Stableford Individuale' ? 'selected' : ''}>Stableford Individuale</option>
                      <option value="Medal / Stroke Play" ${formula === 'Medal / Stroke Play' ? 'selected' : ''}>Medal / Stroke Play</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Marcatore</label>
                    <input type="text" id="nrMarkerInp" class="form-input" placeholder="Opzionale" value="${escapeHTML(marker)}" />
                  </div>
                </div>

                <div class="form-group">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <label class="form-label" style="margin:0;">Giocatori & Handicap (max 4)</label>
                    ${draftPlayers.length < 4 ? `<button type="button" class="btn btn-secondary" style="padding:4px 9px; font-size:11px;" id="nrAddPlayerBtn">+ Giocatore</button>` : ''}
                  </div>
                  ${playersHTML}
                </div>

                <div class="grid-2" style="margin-top:14px;">
                  <button type="button" class="btn btn-secondary" id="nrCancelBtn">Annulla</button>
                  <button type="button" class="btn btn-primary" id="nrStartBtn">Inizia Partita</button>
                </div>
              </div>
            </div>
          `;

          document.getElementById('nrBackdrop').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
          document.getElementById('nrCloseBtn').addEventListener('click', closeModal);
          document.getElementById('nrCancelBtn').addEventListener('click', closeModal);

          document.getElementById('nrCourseSel').addEventListener('change', function () { selectedCourseId = this.value; });
          document.getElementById('nrDateInp').addEventListener('change', function () { roundDate = this.value; });
          document.getElementById('nrTeeSel').addEventListener('change', function () { tee = this.value; });
          document.getElementById('nrFormulaSel').addEventListener('change', function () { formula = this.value; });
          document.getElementById('nrMarkerInp').addEventListener('input', function () { marker = this.value; });

          document.querySelectorAll('[data-nr-pname]').forEach(function (inp) {
            inp.addEventListener('input', function () {
              draftPlayers[Number(this.getAttribute('data-nr-pname'))].name = this.value;
            });
          });

          document.querySelectorAll('[data-nr-phcp]').forEach(function (inp) {
            inp.addEventListener('input', function () {
              draftPlayers[Number(this.getAttribute('data-nr-phcp'))].hcp = Number(this.value) || 0;
            });
          });

          document.querySelectorAll('[data-nr-pdel]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const idx = Number(this.getAttribute('data-nr-pdel'));
              if (draftPlayers.length > 1) {
                draftPlayers.splice(idx, 1);
                renderNewRound();
              }
            });
          });

          const addBtn = document.getElementById('nrAddPlayerBtn');
          if (addBtn) {
            addBtn.addEventListener('click', function () {
              if (draftPlayers.length < 4) {
                draftPlayers.push({ name: `Giocatore ${draftPlayers.length + 1}`, hcp: 18 });
                renderNewRound();
              }
            });
          }

          document.getElementById('nrStartBtn').addEventListener('click', function () {
            const course = state.courses.find(function (c) { return c.id === selectedCourseId; }) || state.courses[0];
            if (!course) return;

            state.rounds.forEach(function (r) {
              if (r.status === 'active') {
                r.status = 'completed';
                r.completedAt = new Date().toISOString();
              }
            });

            const newRound = {
              id: makeId('round'),
              status: 'active',
              courseId: course.id,
              clubName: course.name,
              date: roundDate || getTodayISO(),
              formula: formula,
              tee: tee,
              marker: (marker || '').trim(),
              pars: course.pars.slice(),
              si: course.si.slice(),
              players: draftPlayers.map(function (pl, idx) {
                return {
                  id: makeId('pl'),
                  name: (pl.name || '').trim() || `Giocatore ${idx + 1}`,
                  hcp: Number(pl.hcp) || 0,
                  scores: new Array(18).fill(null)
                };
              })
            };

            state.rounds.unshift(newRound);
            state.currentHole = 0;
            saveState();
            closeModal();
            showToast('Nuova partita avviata!');
            switchTab('campo');
          });
        }

        renderNewRound();
      }

      // =====================================================================
      // 12. EVENTI GLOBALI & AVVIO
      // =====================================================================
      document.getElementById('btnHeaderNewRound').addEventListener('click', function () {
        openNewRoundModal(null);
      });

      document.querySelectorAll('.nav-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          switchTab(this.getAttribute('data-tab'));
        });
      });

      initSilentPWA();
      loadState();
      renderApp();
    });
  </script>
</body>
</html>
